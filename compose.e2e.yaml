services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: homework_e2e
      MYSQL_USER: homework_e2e
      MYSQL_PASSWORD: homework-e2e-only
      MYSQL_ROOT_PASSWORD: homework-e2e-root-only
      TZ: UTC
    ports:
      - "33306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-phomework-e2e-root-only"]
      interval: 3s
      timeout: 3s
      retries: 30
