spring:
  datasource:
    url: jdbc:h2:mem:homework-demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  flyway:
    enabled: true

# profile 专属文件的优先级高于 application.yml，此处写死的字面量会把 application.yml 里的
# ${MODEL_ENABLED:...} 之类的占位符彻底压掉，环境变量再也到不了 app.model.*。
# 因此这里只提供 demo 自己的默认值，覆盖入口仍留给环境变量。
app:
  jwt:
    issuer: homework-analysis-demo
    secret: ${JWT_SECRET:demo-secret-only-for-local-demo-2026-change-me}
    access-minutes: 120
  model:
    enabled: ${MODEL_ENABLED:false}
    base-url: ${MODEL_BASE_URL:http://localhost}
    api-path: ${MODEL_API_PATH:/v1/responses}
    name: ${MODEL_NAME:disabled}
    api-key: ${MODEL_API_KEY:}
    timeout-seconds: ${MODEL_TIMEOUT_SECONDS:10}
  storage:
    # 演示固定用本地目录，且落在用户主目录下：演示数据会随手删除整个演示库，
    # 把文件写进仓库会留下一堆没人认领的孤儿对象。
    provider: LOCAL
    local-root: ${STORAGE_LOCAL_ROOT:${user.home}/.homework-analysis/demo-storage}
